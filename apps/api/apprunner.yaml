version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - yum install -y libjpeg-turbo-devel zlib-devel
    build:
      - echo "Build timestamp v3 - forcing fresh build"
      - pip3 install --upgrade pip
      - mkdir -p ./vendor
      - pip3 install --no-cache-dir -r requirements.txt -t ./vendor
      - ls -la ./vendor
run:
  command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: CORS_ORIGINS
      # Set to the deployed frontend origin(s), comma-separated. Never "*" in production.
      value: "https://REPLACE-WITH-FRONTEND-DOMAIN"
    - name: PYTHONPATH
      value: "/app/apps/api/vendor"
    # DATABASE_URL must NOT be committed here. Configure it as a runtime secret:
    # App Runner console -> Configuration -> Environment variables -> add
    # DATABASE_URL referencing an AWS Secrets Manager or SSM Parameter Store secret.
    # secrets:
    #   - name: DATABASE_URL
    #     value-from: "arn:aws:secretsmanager:REGION:ACCOUNT:secret:NAME"
